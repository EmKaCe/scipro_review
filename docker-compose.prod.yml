# =============================================================================
# SciPro Review — Production overrides
# =============================================================================
# Apply alongside the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes from base:
#   - Named volume data (default, no override needed)
#   - Resource limits (CPU + memory)
#   - Restart: always (survive host reboot)
#   - Executor port NOT exposed to the host (internal only)
#   - Logging driver for production
#   - Container labels for observability
# =============================================================================

services:
  frontend:
    # Only expose frontend to the host; executor is internal
    ports:
      - "4174:4174"
    # Prevent accidental port exposure beyond 4174
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.svelte-review.service: "frontend"
      com.svelte-review.environment: "production"

  executor:
    # No host port mapping in production — frontend reaches executor
    # via the internal Docker network at http://executor:8766
    expose:
      - "8766"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.svelte-review.service: "executor"
      com.svelte-review.environment: "production"
