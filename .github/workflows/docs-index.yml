name: build-docs-index

# The offline docs index is NOT built on GitHub Actions by default — a full
# crawl+embed is a ~40-60 min job that would burn monthly Actions minutes for
# no CI-specific benefit. The canonical path is:
#
#   1. Build locally:   node scripts/build-docs-index.mjs --fetch-crawls <dir> --out <dir>
#                       (needs KI_CONNECT_API_KEY; produces docs-index.json + docs-vectors.bin)
#   2. Publish:         node scripts/publish-docs-index.mjs --dir <dir>
#                       (uploads to the `docs-index` release via gh; ~2 min, 0 Actions minutes)
#   3. Consume:         node scripts/fetch-docs-index.mjs
#
# This workflow only runs when manually dispatched (`Rebuild` checkbox). With
# rebuild=false it is a cheap consistency check; with rebuild=true it runs the
# full build+embed in CI (the rare case someone explicitly wants CI to do it).

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Run the full crawl+embed+build+publish in CI (burns ~40-60 Actions minutes)."
        type: boolean
        default: false

concurrency:
  group: docs-index
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.rebuild != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Report published index + validate config (no build)
        run: |
          echo "== current docs-index release =="
          gh release view docs-index --repo EmKaCe/svelte_review --json tagName,assets --jq '{tag:.tagName, assets:[.assets[].name]}' 2>/dev/null || echo "(no docs-index release published yet)"
          echo "== corpus config parses =="
          node -e 'const L=require("./frontend/scripts/docs-libraries.json").libraries; const zip=Object.entries(L).filter(([k,v])=>v.source==="zip"); const crawl=Object.entries(L).filter(([k,v])=>v.source==="crawl"); console.log(`${Object.keys(L).length} libraries (${zip.length} zip, ${crawl.length} crawl)`)'

  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    if: github.event.inputs.rebuild == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Guard — the API key secret must be present (else no vectors)
        env:
          KI_CONNECT_API_KEY: ${{ secrets.KI_CONNECT_API_KEY }}
        run: |
          if [ -z "$KI_CONNECT_API_KEY" ]; then
            echo "::error::KI_CONNECT_API_KEY secret not set — a CI rebuild would publish a vectorless (BM25-only) index. Use the local build + publish-docs-index.mjs path instead."; exit 1
          fi
      - name: Build + embed (crawls fetched from config)
        working-directory: frontend
        env:
          KI_CONNECT_API_KEY: ${{ secrets.KI_CONNECT_API_KEY }}
        run: |
          node scripts/build-docs-index.mjs --fetch-crawls /tmp/docs-sources --out /tmp/docs-index
      - name: Verify the index is internally consistent (vectors present)
        run: |
          node -e 'const d=require("/tmp/docs-index/docs-index.json"); if (d.vectorCount!==d.chunks.length){throw new Error(`vectorCount ${d.vectorCount} != chunks ${d.chunks.length} — no vectors`) } console.log(`OK: ${d.chunks.length} chunks, ${d.libraries.length} libraries`)'
      - name: Publish to the docs-index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node frontend/scripts/publish-docs-index.mjs --dir /tmp/docs-index
