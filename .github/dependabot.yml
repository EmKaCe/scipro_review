version: 2
updates:
  # Frontend npm/pnpm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: auto
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    # Wait 1 day before creating PRs to avoid pnpm supply-chain policy failures
    # (pnpm v11 minimumReleaseAge rejects packages published within ~24 hours)
    cooldown:
      default-days: 1
      semver-major-days: 2
      semver-minor-days: 1
      semver-patch-days: 1
    groups:
      svelte:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-check"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
          - "tailwind-merge"
          - "tailwind-variants"
          - "tw-animate-css"
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  # Python executor dependencies (pyproject.toml)
  - package-ecosystem: pip
    directory: /executor
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope

  # Git submodules
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: submodules