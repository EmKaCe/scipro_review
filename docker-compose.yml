# =============================================================================
# SciPro Review — Docker Compose (base configuration)
# =============================================================================
# Usage:
#   Development: docker compose up -d                  (auto-loads override.yml)
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services:
#   frontend   — SvelteKit Node server (adapter-node)   :4174
#   executor   — Python FastAPI notebook executor       :8766
#
# Shared volume:
#   data       — Mounted at /app/data/ in both containers
# =============================================================================

name: svelte-review

services:
  # ── SvelteKit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: svelte-review-frontend:latest
    container_name: svelte-review-frontend
    ports:
      - "4174:4174"
    volumes:
      # Shared named volume for persistent data access
      - data:/app/data
    environment:
      - ADAPTER=node
      - PORT=4174
      - NODE_ENV=production
      # Internal URL to reach the executor via Docker DNS
      - EXECUTOR_URL=http://executor:8766
    env_file:
      - .env
    depends_on:
      executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4174/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net

  # ── Python Notebook Executor ────────────────────────────────────────────────
  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    image: svelte-review-executor:latest
    container_name: svelte-review-executor
    expose:
      - "8766"
    volumes:
      - data:/app/data
    environment:
      - PORT=8766
      - EXECUTOR_LOG_LEVEL=info
      - DATA_DIR=/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8766/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net

# ── Persistent Volumes ──────────────────────────────────────────────────────
volumes:
  data:
    name: svelte-review-data
    # Production: Docker-managed named volume (persists across restarts)
    # Development: overridden to bind-mount ./data/ in docker-compose.override.yml

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  app-net:
    name: svelte-review-net
    driver: bridge
