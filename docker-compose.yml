# =============================================================================
# SciPro Review — Teacher Machine
# =============================================================================
# Default Docker Compose configuration for the teacher's grading machine.
#
# Usage:
#   Teacher:   docker compose up -d                           (this file)
#   Dev:       docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Services:
#   frontend   — SvelteKit Node server (adapter-node)   :4174  (teacher accesses this)
#   executor   — Python FastAPI notebook executor       :8766  (internal only)
#
# Shared named volume:
#   data       — Persisted at /app/data/ in both containers
# =============================================================================

name: svelte-review

services:
  # ── SvelteKit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: svelte-review-frontend:latest
    container_name: svelte-review-frontend
    ports:
      - "4174:4174"
    volumes:
      - data:/app/data
    environment:
      - ADAPTER=node
      - PORT=4174
      - NODE_ENV=production
      # adapter-node derives the request base URL from ORIGIN. Without it the
      # protocol defaults to https, so plain-http deployments reject form
      # POSTs (uploads, materials) with a CSRF 403 in real browsers. Set it to
      # the address teachers use to reach the app (http://localhost:4174
      # locally; http://<lan-ip>:4174 or a domain on a teacher machine) — e.g.
      # ORIGIN=http://192.168.1.10:4174 docker compose up -d
      - ORIGIN=${ORIGIN:-http://localhost:4174}
      # Internal URL to reach the executor via Docker DNS
      - EXECUTOR_URL=http://executor:8766
    env_file:
      - .env
    depends_on:
      executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4174/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  # ── Python Notebook Executor ────────────────────────────────────────────────
  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    image: svelte-review-executor:latest
    container_name: svelte-review-executor
    # Not exposed to the host — frontend reaches it via Docker DNS
    expose:
      - "8766"
    volumes:
      - data:/app/data
    environment:
      - PORT=8766
      - EXECUTOR_LOG_LEVEL=info
      - DATA_DIR=/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8766/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

# ── Persistent Volumes ──────────────────────────────────────────────────────
volumes:
  data:
    name: svelte-review-data

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  app-net:
    name: svelte-review-net
    driver: bridge
