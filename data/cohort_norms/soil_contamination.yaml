# Cohort norms for soil_contamination — per-category medians of the
# professor's checked-item counts across the 19 emailed ground-truth
# files (grading-output/emailed-sources/2026SS_soil_contamination/).
#
# Regenerate with: python3 frontend/scripts/compute-cohort-norms.py
# Thresholds (signed off 2026-08-18):
#   Signal A: total > max(median*1.5, median+10)
#   Signal B: category count > category_median + 3
#   Signal C: total within +-10 of median AND overlap < 60%
# typical_checked: sub-point texts checked in >= 50% of the cohort
# (the 'typical review' Signal C compares the pipeline selection against).
assignment: soil_contamination
source: grading-output/emailed-sources/2026SS_soil_contamination/*.json
submissions: 19
global:
  min: 35
  max: 67
  mean: 55.5
  median: 56
  distribution: [35, 43, 44, 46, 50, 52, 53, 54, 55, 56, 58, 59, 60, 61, 64, 65, 66, 66, 67]
categories:
  NumPy:
    median: 5
    max: 5
  Pandas:
    median: 5
    max: 7
  SciPy:
    median: 4
    max: 5
  academicScholarship:
    median: 6
    max: 9
  callingFunction:
    median: 1
    max: 2
  codeFormatting:
    median: 9
    max: 11
  codingConcept:
    median: 3
    max: 4
  followingInstructions:
    median: 2
    max: 2
  general:
    median: 1
    max: 2
  jupyterNotebooks:
    median: 3
    max: 5
  plotting:
    median: 12
    max: 14
  sklearn:
    median: 2
    max: 3
  userDefinedFunctions:
    median: 6
    max: 7
typical_checked:
  NumPy:
    - "Abbreviation: good job on using use the community abbreviation of `np`."
    - "Function: good job on maximizing the use use of NumPy's functions (e.g., `np.add`, `np.subtract`, `np.exp`) to perform meathematics."
    - "Function: good job on using NumPy's `np.exp` functions to perform meathematics."
    - "Types: good job on ensuring NumPy objects (e.g. `np.ndarray`, `np.float64`) were used in the solution."
    - "Vectorization: good use of NumPy's vectorization instead of loops (e.g., for loops)."
  Pandas:
    - "Data inspection: good use of `head()` to preview the DataFrame."
    - "Data loading: correct use of `pd.read_csv`."
    - "DataFrame display: Nicely displayed Pandas DataFrames for better readability."
    - "Functions: good use of Pandas functions."
    - "Functions: good use of `to_numpy()` when passing coordinates to `curve_fit`."
    - "Statitical Analysis: Good job on including and interpreting basic statistical analysis."
  SciPy:
    - "Analysis: good job on using RMSE and R^2 to evaluate the model."
    - "Analysis: if you computed RMSE or R^2, then use the built in functions (e.g., `r2_score`, `mean_squared_error`), thus reducing the chances of introducing errors."
    - "Functions: good job on using SciPy `curve_fit` function."
  academicScholarship:
    - "citing - libraries"
    - "citing - proper ordering within the written text (e.g., ...[1-2]...[3] and not ...[3-4]...[1]...)"
    - "citing - source of information and knowledge"
    - "sentences - clear, concise and provides good context (i.e., C^3)"
    - "sentences - complete written when appropriate (e.g., within markdown cells, docstrings)"
    - "units - input and output numbers have units (e.g., N, kJ, m/s, Hz)"
  callingFunction:
    - "formatting - placing each parameter being passed onto a new line is not necessary and makes the code less concise"
  codeFormatting:
    - "PEP8 guidelines- followed"
    - "blank lines - consistent and good usage"
    - "commenting - appropriate amount provided (i.e., not excessive or insufficient)"
    - "concise, clean and clearly written code"
    - "f-string - properly used"
    - "imports - libraries were listed at the notebook's top"
    - "indentation - consistent and done with 4 spaces"
    - "line length - properly done (e.g., no scrolling is needed)"
    - "naming - descriptive objects/variables (i.e., human readable)"
    - "spacing - consistent and correct usage"
  codingConcept:
    - "dictionary"
    - "list"
    - "tuple"
  jupyterNotebooks:
    - "cell structure - good usage to separate ideas (e.g., thoughts, tasks/subtasks, user-defined functions)"
    - "code cells - good separation of encode ideas"
    - "markdown cells - good usage to communicate ideas, thoughts or workflow"
  plotting:
    - "Color palette: well chosen"
    - "General: Choices behind the plot(s) were well done, resulting in clear and informative data presentation"
    - "Visualization: Very well done, resulting in clear and informative data presentation and understanding."
    - "axis labels"
    - "color"
    - "including units"
    - "legend"
    - "line style"
    - "matplotlib: Good usage of matplotlib for your homework assignment."
    - "point size"
    - "point style"
    - "title"
  sklearn:
    - "Data normalization: did not need to normalize the data since they were of similar magnitude."
    - "Functions: good use of sklearn and its class/functions (e.g., `KMeans`, `k_means`)."
  userDefinedFunctions:
    - "docstring - clearly defining all input variables/objects"
    - "docstring - clearly defining the returned object(s)"
    - "docstring - providing context; stating what the function does"
    - "internal check - proper use of 'if not isinstance', 'raise' statements, etc."
    - "isolating ideas to user-defined functions"
    - "type hinting - applied well for input variables (and for what is returned, if applicable)"
