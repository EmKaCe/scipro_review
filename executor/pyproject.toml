[project]
name = "svelte-review-executor"
version = "0.3.0"
description = "Jupyter notebook execution engine for SciPro Review"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Notebook execution
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29.0",

    # Scientific Python (course curriculum)
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "sympy>=1.13.0",

    # Utilities
    "sigfig>=1.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # HTTP client
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "auto_fix", "ki_connect", "preprocessor", "runner"]

# ── Tooling ──────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
